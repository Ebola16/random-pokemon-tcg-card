name: Daily TCG Check

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-tcg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest commit SHA from PokemonTCG/pokemon-tcg-data
        id: latest_sha
        run: |
          curl -s https://api.github.com/repos/PokemonTCG/pokemon-tcg-data/commits/master \
            | jq -r .sha > new_commit.txt
          echo "new_sha=$(cat new_commit.txt)" >> $GITHUB_OUTPUT

      - name: Get previous commit SHA
        id: previous_sha
        run: |
          if [ -f data/last_commit.txt ]; then
            cat data/last_commit.txt
            echo "old_sha=$(cat data/last_commit.txt)" >> $GITHUB_OUTPUT
          else
            echo "old_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Clone PokemonTCG repo
        if: steps.previous_sha.outputs.old_sha != steps.latest_sha.outputs.new_sha
        run: |
          git clone --depth=1 https://github.com/PokemonTCG/pokemon-tcg-data.git

      - name: Run collectIDs and compare with images.json
        if: steps.previous_sha.outputs.old_sha != steps.latest_sha.outputs.new_sha      
        run: |
          set -e
          mkdir -p data
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const cardsDir = path.join(__dirname, 'pokemon-tcg-data/cards/en');
          const imagesPath = path.join(__dirname, 'data/images.json');

          async function collectIDs() {
            const allIDs = [];
            const files = await fs.promises.readdir(cardsDir);

            for (const file of files) {
              if (file.endsWith('.json')) {
                const filePath = path.join(cardsDir, file);
                try {
                  const content = await fs.promises.readFile(filePath, 'utf8');
                  const cards = JSON.parse(content);

                  if (Array.isArray(cards)) {
                    for (const card of cards) {
                      if (card.id) {
                        const updatedId = card.id.replace(/-(?=[^-]*$)/, '/');
                        allIDs.push(updatedId);
                      }
                    }
                  } else {
                    console.warn(`Skipped non-array file: ${file}`);
                  }
                } catch (err) {
                  console.error(`Failed to process ${file}:`, err.message);
                }
              }
            }

            return allIDs;
          }

          function naturalSort(a, b) {
            const idxA = a.lastIndexOf('/');
            const idxB = b.lastIndexOf('/');

            const setA = a.slice(0, idxA);
            const setB = b.slice(0, idxB);

            const numA = a.slice(idxA + 1);
            const numB = b.slice(idxB + 1);

            // Compare set code alphabetically
            if (setA < setB) return -1;
            if (setA > setB) return 1;

            // Regex: [prefix letters][digits][suffix letters] (all optional parts)
            const pattern = /^([A-Za-z]*)(\d+)([A-Za-z]*)$/;
            const matchA = numA.match(pattern);
            const matchB = numB.match(pattern);

            if (matchA && matchB) {
              const [, prefixA, digitsA, suffixA] = matchA;
              const [, prefixB, digitsB, suffixB] = matchB;

              if (prefixA < prefixB) return -1;
              if (prefixA > prefixB) return 1;

              const nA = parseInt(digitsA, 10);
              const nB = parseInt(digitsB, 10);
              if (nA !== nB) return nA - nB;

              if (suffixA < suffixB) return -1;
              if (suffixA > suffixB) return 1;

              return 0;
            }

            // fallback: locale-aware compare with numeric option
            return numA.localeCompare(numB, undefined, { numeric: true, sensitivity: 'base' });
          }

          async function run() {
            const newIDs = (await collectIDs()).sort(naturalSort);

            let existingIDs = [];
            if (fs.existsSync(imagesPath)) {
              try {
                existingIDs = JSON.parse(await fs.promises.readFile(imagesPath, 'utf8'));
              } catch (err) {
                console.warn("⚠️ Failed to read existing images.json:", err.message);
              }
            }

            const sortedExisting = [...existingIDs].sort(naturalSort);
            const isDifferent = JSON.stringify(newIDs) !== JSON.stringify(sortedExisting);

            if (isDifferent) {
              await fs.promises.writeFile(imagesPath, JSON.stringify(newIDs, null, 2) + "\n");
              console.log("✅ Updated images.json with new IDs.");
            } else {
              console.log("✅ No changes to IDs. images.json is up to date.");
            }

            fs.writeFileSync('id_diff_result.txt', isDifferent ? "true" : "false");
          }

          run();
          EOF

      - name: Check if images.json was updated
        if: steps.previous_sha.outputs.old_sha != steps.latest_sha.outputs.new_sha
        id: check_diff
        run: |
          if [ -f id_diff_result.txt ] && grep -q "true" id_diff_result.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest commit info from PokemonTCG/pokemon-tcg-data
        if: steps.previous_sha.outputs.old_sha != steps.latest_sha.outputs.new_sha
        id: latest_commit
        run: |
          curl -s https://api.github.com/repos/PokemonTCG/pokemon-tcg-data/commits/master > commit.json
          sha=$(jq -r .sha commit.json)
          message=$(jq -r .commit.message commit.json | head -n 1)
          echo "new_sha=$sha" >> $GITHUB_OUTPUT
          echo "commit_message=$message" >> $GITHUB_OUTPUT

      
      - name: Commit and push updated images.json
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "Update latest card IDs from: ${{ steps.latest_commit.outputs.commit_message }}"
          git push


      - name: Update last_commit.txt
        if: steps.previous_sha.outputs.old_sha != steps.latest_sha.outputs.new_sha
        run: |
          echo "${{ steps.latest_sha.outputs.new_sha }}" > data/last_commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_commit.txt
          git commit -m "Update last commit SHA"
          git push
